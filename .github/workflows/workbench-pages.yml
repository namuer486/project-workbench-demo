name: Build project workbench

on:
  push:
    branches: [main]
    paths: ['projects/**', 'platform/**', '.github/workflows/workbench-pages.yml']
  pull_request:
    paths: ['projects/**', 'platform/**', '.github/workflows/workbench-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r platform/requirements.txt
      - run: python -m unittest discover -s platform/tests -v
      - run: python platform/build_static.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    # Off by default: select site visibility before enabling deployment.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.WORKBENCH_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy workbench
        id: deployment
        uses: actions/deploy-pages@v4
